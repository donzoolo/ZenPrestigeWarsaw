<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zen Prestige Warsaw</title>

  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8B7E6A">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-192.png">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <header>
    <button class="theme-toggle" id="theme-toggle"><i class="ti ti-moon"></i></button>
    <h1 id="page-title">Welcome to Zen Prestige Warsaw</h1>
    <div class="lang-switcher">
      <img src="assets/flags/gb.png" alt="GB" class="flag active" data-lang="en">
      <img src="assets/flags/pl.png" alt="PL" class="flag" data-lang="pl">
      <img src="assets/flags/de.png" alt="DE" class="flag" data-lang="de">
      <img src="assets/flags/fr.png" alt="FR" class="flag" data-lang="fr">
      <img src="assets/flags/it.png" alt="IT" class="flag" data-lang="it">
      <img src="assets/flags/es.png" alt="ES" class="flag" data-lang="es">
      <img src="assets/flags/nl.png" alt="NL" class="flag" data-lang="nl">
      <img src="assets/flags/cz.png" alt="CZ" class="flag" data-lang="cz">
      <img src="assets/flags/sk.png" alt="SK" class="flag" data-lang="sk">
      <img src="assets/flags/ua.png" alt="UA" class="flag" data-lang="ua">
    </div>
  </header>

  <div class="search-bar">
    <input type="text" class="search-input" id="search" autocomplete="off">
  </div>

  <main id="panels-container"><div class="loading">Loading guide…</div></main>
  <div class="no-results" id="no-results"></div>

  <div class="contact-section" id="contact-section">
    <h3 id="contact-title"><i class="ti ti-message-circle"></i> Contact Us</h3>
    <div class="contact-item" id="contact-issues"><i class="ti ti-alert-triangle"></i><span></span></div>
    <div class="contact-item" id="contact-suggestions"><i class="ti ti-bulb"></i><span></span></div>
  </div>

  <div id="update-banner">
    New version available! <button onclick="updatePWA()">Update Now</button>
  </div>
</div>

<!-- LIGHTBOX GALLERY -->
<div id="lightbox" class="lightbox">
  <div class="lightbox-content">
    <button class="lightbox-prev" id="lightbox-prev">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <img src="" alt="" id="lightbox-img" class="lightbox-img">

    <button class="lightbox-next" id="lightbox-next">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

    <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>

    <button class="lightbox-close" id="lightbox-close">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>

<script>
  /* ---------- DOM ---------- */
  const DOM = {
    panelsContainer: document.getElementById('panels-container'),
    pageTitle: document.getElementById('page-title'),
    searchInput: document.getElementById('search'),
    noResults: document.getElementById('no-results'),
    flags: document.querySelectorAll('.flag'),
    lightbox: document.getElementById('lightbox'),
    lightboxImg: document.getElementById('lightbox-img'),
    lightboxPrev: document.getElementById('lightbox-prev'),
    lightboxNext: document.getElementById('lightbox-next'),
    lightboxCounter: document.getElementById('lightbox-counter'),
    lightboxClose: document.getElementById('lightbox-close'),
    themeToggle: document.getElementById('theme-toggle'),
    contactIssues: document.getElementById('contact-issues').querySelector('span'),
    contactSuggestions: document.getElementById('contact-suggestions').querySelector('span'),
    contactTitle: document.getElementById('contact-title'),
    updateBanner: document.getElementById('update-banner')
  };

  /* ---------- STATE ---------- */
  let content = {};
  let currentLang = 'en';
  let allPanels = [];
  let currentTheme = localStorage.getItem('theme') || 'light';
  let newWorker;
  let isUpdating = false;

  // Lightbox Gallery
  let currentGallery = [];
  let currentIndex = 0;

  /* ---------- LIGHTBOX GALLERY ---------- */
  function openLightbox(images, startIndex = 0) {
    currentGallery = images;
    currentIndex = startIndex;
    showImage();
    DOM.lightbox.classList.add('active');
  }

  function showImage() {
    const img = currentGallery[currentIndex];
    DOM.lightboxImg.src = img.src;
    DOM.lightboxImg.alt = img.alt || 'Photo';
    DOM.lightboxCounter.textContent = `${currentIndex + 1} / ${currentGallery.length}`;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % currentGallery.length;
    showImage();
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
    showImage();
  }

  // Swipe
  let touchStartX = 0;
  DOM.lightbox.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  DOM.lightbox.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) diff > 0 ? nextImage() : prevImage();
  });

  // Click left/right on image
  DOM.lightboxImg.addEventListener('click', e => {
    const rect = DOM.lightboxImg.getBoundingClientRect();
    const x = e.clientX - rect.left;
    x < rect.width / 2 ? prevImage() : nextImage();
  });

  // Buttons
  DOM.lightboxPrev.addEventListener('click', prevImage);
  DOM.lightboxNext.addEventListener('click', nextImage);
  DOM.lightboxClose.addEventListener('click', () => DOM.lightbox.classList.remove('active'));
  DOM.lightbox.addEventListener('click', e => {
    if (e.target === DOM.lightbox) DOM.lightbox.classList.remove('active');
  });

  /* ---------- LOAD CONTENT ---------- */
  async function loadContent() {
    try {
      const res = await fetch('content.json?v=' + Date.now());
      if (!res.ok) throw new Error('Not found');
      content = await res.json();
    } catch (err) {
      console.warn('Offline:', err);
      const cache = await caches.open('apartment-guide-v5');
      const cached = await cache.match('content.json');
      if (cached) content = await cached.json();
      else {
        DOM.panelsContainer.innerHTML = `<div style="color:red;padding:2rem;">No cached content. Connect to internet first.</div>`;
        return;
      }
    }
    allPanels = content[currentLang] || content.en || [];
    renderPanels(allPanels);
    updateUI();
  }

  function updateUI() {
    const ui = content.ui || {};
    const t = (key, fallback) => (ui[key] && ui[key][currentLang]) || fallback || "";

    DOM.pageTitle.textContent = content.titles?.[currentLang] || "Welcome";
    DOM.searchInput.placeholder = t("searchPlaceholder", "Search…");
    DOM.noResults.textContent = t("noResults", "No results.");
    DOM.contactTitle.innerHTML = `Contact Us ${t("contactTitle", "Contact Us")}`;
    DOM.contactIssues.innerHTML = t("contactIssues", "Contact support.");
    DOM.contactSuggestions.innerHTML = t("contactSuggestions", "Send feedback.");
  }

  /* ---------- RENDER PANELS ---------- */
  function renderPanels(list) {
    DOM.panelsContainer.innerHTML = '';
    if (!list.length) { DOM.noResults.style.display = 'block'; return; }
    DOM.noResults.style.display = 'none';

    list.forEach(p => {
      const div = document.createElement('div');
      div.className = 'panel visible';
      div.innerHTML = `
        <div class="panel-title">${p.title}</div>
        <div class="panel-content"><div class="panel-text">${p.html}</div></div>
      `;
      DOM.panelsContainer.appendChild(div);

      div.querySelector('.panel-title').addEventListener('click', () => div.classList.toggle('active'));

      // Gallery support
      const thumbs = div.querySelectorAll('.thumb');
      thumbs.forEach((img, i) => {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', () => {
          const gallery = Array.from(thumbs);
          openLightbox(gallery, i);
        });
      });
    });
  }

  /* ---------- SEARCH & LANG ---------- */
  function filterPanels(q) {
    if (!q.trim()) return renderPanels(allPanels);
    const lower = q.toLowerCase();
    const matches = allPanels.filter(p =>
      p.title.toLowerCase().includes(lower) || p.html.toLowerCase().includes(lower)
    );
    renderPanels(matches);
  }

  DOM.flags.forEach(f => f.addEventListener('click', () => {
    currentLang = f.dataset.lang;
    DOM.flags.forEach(x => x.classList.remove('active'));
    f.classList.add('active');
    allPanels = content[currentLang] || content.en;
    updateUI();
    filterPanels(DOM.searchInput.value);
  }));

  DOM.searchInput.addEventListener('input', () => filterPanels(DOM.searchInput.value));

  /* ---------- THEME ---------- */
	function applyTheme() {
	  document.documentElement.setAttribute('data-theme', currentTheme);
	  
	  // ZMIENIAMY TYLKO KLASĘ IKONY
	  const icon = DOM.themeToggle.querySelector('i');
	  if (icon) {
		icon.className = currentTheme === 'light' 
		  ? 'ti ti-moon'     // tryb jasny → księżyc
		  : 'ti ti-sun';     // tryb ciemny → słońce
	  }
	}

	DOM.themeToggle.addEventListener('click', () => {
	  currentTheme = currentTheme === 'light' ? 'dark' : 'light';
	  localStorage.setItem('theme', currentTheme);
	  applyTheme();
	});

  /* ---------- SERVICE WORKER ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js?v=' + Date.now())
        .then(reg => {
          reg.update();
          reg.onupdatefound = () => {
            newWorker = reg.installing;
            newWorker.onstatechange = () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller && !isUpdating) {
                DOM.updateBanner.style.display = 'block';
              }
            };
          };
        });
    });

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (isUpdating) window.location.reload();
    });
  }

  window.updatePWA = function () {
    if (newWorker && !isUpdating) {
      isUpdating = true;
      DOM.updateBanner.style.display = 'none';
      newWorker.postMessage({ action: 'skipWaiting' });
    }
  };

  /* ---------- INIT ---------- */
  applyTheme();
  loadContent();
</script>

</body>
</html>
