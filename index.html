<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zen Prestige Warsaw</title>

  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8B7E6A">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-192.png">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <header>
    <button class="theme-toggle" id="theme-toggle"><i class="ti ti-moon"></i></button>
    <h1 id="page-title">Welcome to Zen Prestige Warsaw</h1>
	<div class="lang-switcher">
	  <img src="assets/flags/gb.png" alt="GB" class="flag active" data-lang="en">
	  <img src="assets/flags/pl.png" alt="PL" class="flag" data-lang="pl">
	  <img src="assets/flags/de.png" alt="DE" class="flag" data-lang="de">
	  <img src="assets/flags/fr.png" alt="FR" class="flag" data-lang="fr">
	  <img src="assets/flags/it.png" alt="IT" class="flag" data-lang="it">
	  <img src="assets/flags/es.png" alt="ES" class="flag" data-lang="es">
	  <img src="assets/flags/nl.png" alt="NL" class="flag" data-lang="nl">
	  <img src="assets/flags/cz.png" alt="CZ" class="flag" data-lang="cz">
	  <img src="assets/flags/sk.png" alt="SK" class="flag" data-lang="sk">
	  <img src="assets/flags/ua.png" alt="UA" class="flag" data-lang="ua">
	</div>
  </header>

  <div class="search-bar">
    <input type="text" class="search-input" id="search" autocomplete="off">
  </div>

  <main id="panels-container"><div class="loading">Loading guide…</div></main>

  <div class="no-results" id="no-results"></div>

  <div class="contact-section" id="contact-section">
    <h3 id="contact-title"><i class="ti ti-message-circle"></i> Contact Us</h3>
    <div class="contact-item" id="contact-issues"><i class="ti ti-alert-triangle"></i><span></span></div>
    <div class="contact-item" id="contact-suggestions"><i class="ti ti-bulb"></i><span></span></div>
  </div>

  <div id="update-banner">
    New version available! <button onclick="updatePWA()">Update Now</button>
  </div>
</div>

<div class="lightbox" id="lightbox"><img src="" alt="Enlarged" id="lightbox-img"></div>

<script>
  /* ---------- DOM ---------- */
  const panelsContainer = document.getElementById('panels-container');
  const pageTitle       = document.getElementById('page-title');
  const searchInput     = document.getElementById('search');
  const noResults       = document.getElementById('no-results');
  const flags           = document.querySelectorAll('.flag');
  const lightbox        = document.getElementById('lightbox');
  const lightboxImg     = document.getElementById('lightbox-img');
  const themeToggle     = document.getElementById('theme-toggle');
  const contactIssues   = document.getElementById('contact-issues').querySelector('span');
  const contactSuggestions = document.getElementById('contact-suggestions').querySelector('span');
  const contactTitle    = document.getElementById('contact-title');

  /* ---------- STATE ---------- */
  let content = {};
  let currentLang = 'en';
  let allPanels   = [];
  let currentTheme = localStorage.getItem('theme') || 'light';
  let newWorker;
  let isUpdating = false;

  /* ---------- TRANSLATIONS ---------- */
const translations = {
  searchPlaceholder: {
    en: "Search instructions…",
    pl: "Szukaj instrukcji…",
    de: "Anweisungen suchen…",
    fr: "Rechercher des instructions…",
    it: "Cerca istruzioni…",
    es: "Buscar instrucciones…",
    nl: "Zoek instructies…",
    cz: "Hledat pokyny…",
    sk: "Hľadať inštrukcie…",
    ua: "Шукати інструкції…"
  },
  contactTitle: {
    en: "Contact Us",
    pl: "Skontaktuj się z nami",
    de: "Kontaktieren Sie uns",
    fr: "Contactez-nous",
    it: "Contattaci",
    es: "Contáctenos",
    nl: "Neem contact op",
    cz: "Kontaktujte nás",
    sk: "Kontaktujte nás",
    ua: "Зв'яжіться з нами"
  },
  contactIssues: {
    en: "For any issues with the apartment, please contact: <strong>Jan Kowalski</strong> at <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> or phone <a href='tel:+48123456789'>+48 123 456 789</a>",
    pl: "W razie problemów z apartamentem: <strong>Jan Kowalski</strong> – <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> lub <a href='tel:+48123456789'>+48 123 456 789</a>",
    de: "Bei Problemen mit der Wohnung: <strong>Jan Kowalski</strong> – <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> oder <a href='tel:+48123456789'>+48 123 456 789</a>",
    fr: "En cas de problème avec l'appartement, contactez : <strong>Jan Kowalski</strong> à <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> ou au <a href='tel:+48123456789'>+48 123 456 789</a>",
    it: "Per qualsiasi problema con l'appartamento, contatta: <strong>Jan Kowalski</strong> a <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> o al <a href='tel:+48123456789'>+48 123 456 789</a>",
    es: "Para cualquier problema con el apartamento, contacta con: <strong>Jan Kowalski</strong> en <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> o al <a href='tel:+48123456789'>+48 123 456 789</a>",
    nl: "Bij problemen met het appartement, neem contact op met: <strong>Jan Kowalski</strong> via <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> of telefoon <a href='tel:+48123456789'>+48 123 456 789</a>",
    cz: "V případě problémů s apartmánem kontaktujte: <strong>Jan Kowalski</strong> na <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> nebo telefonicky <a href='tel:+48123456789'>+48 123 456 789</a>",
    sk: "V prípade problémov s apartmánom kontaktujte: <strong>Jan Kowalski</strong> na <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> alebo telefonicky <a href='tel:+48123456789'>+48 123 456 789</a>",
    ua: "У разі проблем з апартаментами звертайтеся до: <strong>Jan Kowalski</strong> за адресою <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> або за телефоном <a href='tel:+48123456789'>+48 123 456 789</a>"
  },
  contactSuggestions: {
    en: "For suggestions about the apartment or this guide, email us at <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>",
    pl: "Masz sugestie? Napisz na <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>",
    de: "Vorschläge? Schreiben Sie an <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>",
    fr: "Des suggestions ? Écrivez-nous à <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>",
    it: "Hai suggerimenti? Scrivici a <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>",
    es: "¿Sugerencias? Escríbenos a <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>",
    nl: "Suggesties? Stuur een e-mail naar <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>",
    cz: "Máte návrhy? Napište nám na <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>",
    sk: "Máte návrhy? Napíšte nám na <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>",
    ua: "Є пропозиції? Напишіть нам на <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>"
  },
  noResults: {
    en: "No instructions found. Try another keyword.",
    pl: "Nie znaleziono instrukcji. Spróbuj innego słowa.",
    de: "Keine Anweisungen gefunden. Versuchen Sie ein anderes Wort.",
    fr: "Aucune instruction trouvée. Essayez un autre mot-clé.",
    it: "Nessuna istruzione trovata. Prova un'altra parola chiave.",
    es: "No se encontraron instrucciones. Prueba otra palabra clave.",
    nl: "Geen instructies gevonden. Probeer een ander trefwoord.",
    cz: "Nebyly nalezeny žádné pokyny. Zkuste jiné klíčové slovo.",
    sk: "Neboli nájdené žiadne inštrukcie. Skúste iné kľúčové slovo.",
    ua: "Інструкції не знайдено. Спробуйте інше ключове слово."
  }
};

  /* ---------- LOAD CONTENT ---------- */
  async function loadContent() {
    try {
      const res = await fetch('content.json?v=' + Date.now());
      if (!res.ok) throw new Error('Not found');
      content = await res.json();
    } catch (err) {
      console.warn('Offline / error:', err);
      const cache = await caches.open('apartment-guide-v2');
      const cached = await cache.match('content.json');
      if (cached) content = await cached.json();
      else {
        panelsContainer.innerHTML = `<div style="color:red;padding:2rem;">No cached content. Connect to internet first.</div>`;
        return;
      }
    }
    allPanels = content[currentLang] || content.en || [];
    renderPanels(allPanels);
    updateUI();
  }

  async function loadVersion() {
    try {
      const res = await fetch('https://api.github.com/repos/donzoolo/ZenPrestigeWarsaw/tags?per_page=1');
      if (!res.ok) throw new Error('API failed');
      const tags = await res.json();
      if (!tags || tags.length === 0) throw new Error('No tags');
      const latest = tags[0];
      const version = latest.name;
      const date = new Date(latest.commit?.committer?.date || Date.now())
        .toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      console.log('Version:', version, '| Updated:', date);
    } catch (err) {
      console.warn('Version fetch failed (offline/no tags):', err.message);
    }
  }

	function updateUI() {
	  pageTitle.textContent = content.titles?.[currentLang] || translations.contactTitle[currentLang] || "Welcome";
	  searchInput.placeholder = translations.searchPlaceholder[currentLang] || "Search…";
	  noResults.textContent   = translations.noResults[currentLang] || "No results.";
	  contactTitle.innerHTML  = `<i class="ti ti-message-circle"></i> ${translations.contactTitle[currentLang] || "Contact Us"}`;
	  contactIssues.innerHTML = translations.contactIssues[currentLang] || translations.contactIssues.en;
	  contactSuggestions.innerHTML = translations.contactSuggestions[currentLang] || translations.contactSuggestions.en;
	}

  /* ---------- RENDER PANELS ---------- */
  function renderPanels(list) {
    panelsContainer.innerHTML = '';
    if (!list.length) { noResults.style.display = 'block'; return; }
    noResults.style.display = 'none';
    list.forEach(p => {
      const div = document.createElement('div');
      div.className = 'panel visible';
      div.innerHTML = `<div class="panel-title">${p.title}</div>
                       <div class="panel-content"><div class="panel-text">${p.html}</div></div>`;
      panelsContainer.appendChild(div);
      div.querySelector('.panel-title').addEventListener('click',()=>div.classList.toggle('active'));
      div.querySelectorAll('.thumb').forEach(img=>img.addEventListener('click',()=>{
        lightboxImg.src = img.src; lightbox.classList.add('active');
      }));
    });
  }

  /* ---------- SEARCH & LANG ---------- */
  function filterPanels(q) {
    if (!q.trim()) return renderPanels(allPanels);
    const lower = q.toLowerCase();
    const matches = allPanels.filter(p=>p.title.toLowerCase().includes(lower)||p.html.toLowerCase().includes(lower));
    renderPanels(matches);
  }
  flags.forEach(f=>f.addEventListener('click',()=>{
    currentLang = f.dataset.lang;
    flags.forEach(x=>x.classList.remove('active'));
    f.classList.add('active');
    allPanels = content[currentLang]||content.en;
    updateUI(); filterPanels(searchInput.value);
  }));
  searchInput.addEventListener('input',()=>filterPanels(searchInput.value));
  lightbox.addEventListener('click',()=>lightbox.classList.remove('active'));

  /* ---------- THEME ---------- */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme',currentTheme);
    themeToggle.innerHTML = currentTheme==='light' ? '<i class="ti ti-moon"></i>' : '<i class="ti ti-sun"></i>';
  }
  themeToggle.addEventListener('click',()=>{
    currentTheme = currentTheme==='light'?'dark':'light';
    localStorage.setItem('theme',currentTheme); applyTheme();
  });

  /* ---------- SERVICE WORKER (AUTO-UPDATE) ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js?v=' + Date.now())
        .then(reg => {
          console.log('SW registered', reg);
          reg.update();
          reg.onupdatefound = () => {
            newWorker = reg.installing;
            newWorker.onstatechange = () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller && !isUpdating) {
                showUpdateUI();
              }
            };
          };
        })
        .catch(err => console.error('SW failed:', err));
    });

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (isUpdating) {
        console.log('Update applied — reloading');
        window.location.reload();
      }
    });
  }

  function showUpdateUI() {
    const banner = document.getElementById('update-banner');
    if (banner) banner.style.display = 'block';
  }

  function updatePWA() {
    if (newWorker && !isUpdating) {
      isUpdating = true;
      const banner = document.getElementById('update-banner');
      if (banner) banner.style.display = 'none';
      newWorker.postMessage({ action: 'skipWaiting' });
    }
  }

  /* ---------- INIT ---------- */
  loadVersion();
  applyTheme();
  loadContent();
</script>
</body>
</html>
