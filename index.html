<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-key="title">Apartment Guide</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8B7E6A">
  <link rel="icon" href="assets/icons/icon-192.png">

  <!-- CSP -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://api.github.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    connect-src 'self' https://api.github.com;
  ">

  <!-- Preload -->
  <link rel="preload" href="css/style.css" as="style">
  <link rel="stylesheet" href="css/style.css">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" 
        integrity="sha384-..." crossorigin="anonymous">
</head>
<body>

<div class="container">
  <header>
    <button class="theme-toggle" aria-label="Toggle dark mode">
      <i class="ti ti-moon"></i>
    </button>
    <h1 data-key="title">Welcome</h1>
    <div class="lang-switcher" role="tablist">
      <button role="tab" aria-selected="true" data-lang="en"><img src="assets/flags/en.svg" alt="English"></button>
      <button role="tab" data-lang="pl"><img src="assets/flags/pl.svg" alt="Polski"></button>
      <button role="tab" data-lang="de"><img src="assets/flags/de.svg" alt="Deutsch"></button>
    </div>
  </header>

  <div class="search-bar">
    <input type="text" placeholder="Search..." aria-label="Search instructions" id="search">
  </div>

  <main id="panels-container" role="region" aria-live="polite"></main>

  <div class="no-results" id="no-results">No results found.</div>

  <div class="contact-section">
    <h3><i class="ti ti-message-circle"></i> <span data-key="contact">Contact Us</span></h3>
    <p data-key="contact-text">Wi-Fi and check-in details provided at arrival.</p>
  </div>

  <div id="update-banner" role="alert">
    New version available! <button onclick="updatePWA()">Update Now</button>
  </div>
</div>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <img src="" alt="" id="lightbox-img">
</div>

<script>
  const VERSION = "v0.0.6"; // Auto-injected by deploy
  let newWorker, isUpdating = false;

  // === Load Content ===
  async function loadContent() {
    try {
      const res = await fetch(`content.json?v=${VERSION}`);
      content = await res.json();
    } catch {
      const cached = await caches.match('content.json');
      content = cached ? await cached.json() : { en: [] };
    }
    renderPanels(content[currentLang] || content.en || []);
    updateUI();
  }

  // === SW: Network-first HTML/JSON, Stale-while-revalidate assets ===
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(`sw.js?v=${VERSION}`)
      .then(reg => {
        reg.update();
        reg.onupdatefound = () => {
          newWorker = reg.installing;
          newWorker.onstatechange = () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller && !isUpdating) {
              document.getElementById('update-banner').style.display = 'block';
            }
          };
        };
      });
  }

  function updatePWA() {
    if (newWorker && !isUpdating) {
      isUpdating = true;
      document.getElementById('update-banner').style.display = 'none';
      newWorker.postMessage({ action: 'skipWaiting' });
    }
  }

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (isUpdating) window.location.reload();
  });

  // === Panel State Persistence ===
  const saveState = () => localStorage.setItem('panels', JSON.stringify(
    Array.from(document.querySelectorAll('.panel')).map(p => p.classList.contains('active'))
  ));
  const loadState = () => {
    const state = JSON.parse(localStorage.getItem('panels') || '[]');
    document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', state[i]));
  };

  // === Init ===
  loadContent().then(() => {
    setTimeout(loadState, 100);
    document.addEventListener('click', e => {
      if (e.target.closest('.panel-title')) saveState();
    });
  });
</script>
</body>
</html>
