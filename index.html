<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apartment Guide</title>

  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8B7E6A">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>House</text></svg>">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <style>
    :root {
      --bg: #FAF9F7;
      --container-bg: #FFFFFF;
      --text: #3C3C3C;
      --accent: #8B7E6A;
      --light: #F5F0E8;
      --border: #E8E3DC;
      --radius: 12px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    [data-theme="dark"] {
      --bg: #1A1A1A;
      --container-bg: #222222;
      --text: #E0E0E0;
      --accent: #BFAF8F;
      --light: #2A2A2A;
      --border: #333333;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding: 1rem;
      min-height: 100vh;
      transition: background 0.3s ease;
    }

    .container {
      max-width: 900px;
      margin: 2rem auto;
      background: var(--container-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      transition: background 0.3s, box-shadow 0.3s;
    }

    header {
      padding: 2rem 2rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: var(--light);
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .theme-toggle:hover {
      background: rgba(139, 126, 106, 0.15);
    }

    [data-theme="dark"] .theme-toggle:hover {
      background: rgba(191, 175, 143, 0.2);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .lang-switcher {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .flag {
      width: 36px;
      height: 24px;
      cursor: pointer;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border);
      transition: transform 0.2s, border 0.2s;
    }

    .flag:hover { transform: scale(1.1); }
    .flag.active { border: 2px solid var(--accent); }

    .search-bar {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--container-bg);
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--light);
      color: var(--text);
      outline: none;
      transition: border 0.2s, background 0.3s;
    }

    .search-input::placeholder {
      color: #888;
      opacity: 1;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 126, 106, 0.15);
    }

    [data-theme="dark"] .search-input:focus {
      box-shadow: 0 0 0 3px rgba(191, 175, 143, 0.2);
    }

    .panel {
      border-bottom: 1px solid var(--border);
      display: none;
    }

    .panel.visible { display: block; }

    .panel:last-child { border-bottom: none; }

    .panel-title {
      padding: 1.5rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
      font-size: 1.1rem;
      transition: background 0.2s;
    }

    .panel-title:hover { background: var(--light); }

    .panel-title::after {
      content: "+";
      font-size: 1.5rem;
      color: var(--accent);
    }

    .panel.active .panel-title::after { content: "−"; }

    .panel-content {
      padding: 0 1.5rem;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.4s ease;
      background: var(--container-bg);
    }

    .panel.active .panel-content {
      padding: 1.5rem;
      max-height: 2000px;
    }

    .panel-text {
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .thumb {
      width: 100%;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      cursor: zoom-in;
      border: 1px solid var(--border);
      transition: transform 0.2s;
    }

    .thumb:hover { transform: scale(1.03); }

    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0 \0,0.4);
    }

    .lightbox.active { display: flex; }

    .no-results {
      padding: 2rem;
      text-align: center;
      color: #888;
      font-style: italic;
      display: none;
    }

    .contact-section {
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--light);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .contact-section h3 {
      margin-bottom: 0.75rem;
      color: var(--accent);
      font-weight: 500;
    }

    .contact-section p {
      margin-bottom: 0.75rem;
    }

    .contact-section a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .contact-section a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .container { margin: 1rem; }
      h1 { font-size: 1.5rem; }
      .panel-title { font-size: 1rem; padding: 1.2rem; }
      .search-bar { padding: 1rem; }
      .theme-toggle { top: 0.75rem; right: 0.75rem; }
    }
  </style>
</head>
<body>
<div class="container">
<div id="update-banner" style="display:none; background:#8B7E6A; color:white; padding:1rem; text-align:center; font-size:0.9rem;">
  New version available! 
  <button onclick="updatePWA()" style="background:white; color:#8B7E6A; border:none; padding:0.5rem 1rem; margin-left:0.5rem; border-radius:4px; cursor:pointer;">
    Update Now
  </button>
</div>
  <header>
    <button class="theme-toggle" id="theme-toggle">
      <i class="ti ti-moon"></i>
    </button>
    <h1 id="page-title">Welcome to Your Apartment</h1>
    <div class="lang-switcher">
      <img src="https://flagcdn.com/gb.svg" alt="EN" class="flag active" data-lang="en">
      <img src="https://flagcdn.com/pl.svg" alt="PL" class="flag" data-lang="pl">
      <img src="https://flagcdn.com/de.svg" alt="DE" class="flag" data-lang="de">
    </div>
  </header>

  <div class="search-bar">
    <input type="text" class="search-input" id="search" autocomplete="off">
  </div>

  <main id="panels-container">
    <div class="loading">Loading guide...</div>
  </main>

  <div class="no-results" id="no-results">
    No instructions found. Try another keyword.
  </div>

  <!-- Contact Section -->
  <div class="contact-section" id="contact-section">
    <h3 id="contact-title">Contact</h3>
    <p id="contact-issues"></p>
    <p id="contact-suggestions"></p>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img src="" alt="Enlarged" id="lightbox-img">
</div>

<script>
let newWorker;
function showUpdateUI() {
  document.getElementById('update-banner').style.display = 'block';
}

function updatePWA() {
  newWorker.postMessage({ action: 'skipWaiting' });
}

self.addEventListener('controllerchange', () => {
  window.location.reload();
});
  // === PWA: Register Service Worker ===
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
navigator.serviceWorker.register('sw.js?v=' + Date.now())
  .then(reg => {
    console.log('SW registered', reg);
    reg.update(); // Check for updates

    // === AUTO-UPDATE BANNER ===
    let newWorker;
    reg.onupdatefound = () => {
      newWorker = reg.installing;
      newWorker.onstatechange = () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          showUpdateUI();
        }
      };
    };
  })
  .catch(err => console.log('SW failed', err));
  });
}
// In SW registration success:
reg.onupdatefound = () => {
  newWorker = reg.installing;
  newWorker.onstatechange = () => {
    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
      showUpdateUI();
    }
  };
};
  // === DOM ===
  const panelsContainer = document.getElementById('panels-container');
  const pageTitle = document.getElementById('page-title');
  const searchInput = document.getElementById('search');
  const noResults = document.getElementById('no-results');
  const flags = document.querySelectorAll('.flag');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const themeToggle = document.getElementById('theme-toggle');
  const contactSection = document.getElementById('contact-section');
  const contactTitle = document.getElementById('contact-title');
  const contactIssues = document.getElementById('contact-issues');
  const contactSuggestions = document.getElementById('contact-suggestions');

  // === STATE ===
  let content = {};
  let currentLang = 'en';
  let allPanels = [];
  let currentTheme = localStorage.getItem('theme') || 'light';

  // === TRANSLATIONS ===
  const translations = {
    searchPlaceholder: {
      en: "Search instructions...",
      pl: "Szukaj instrukcji...",
      de: "Anweisungen suchen..."
    },
    contactTitle: {
      en: "Contact",
      pl: "Kontakt",
      de: "Kontakt"
    },
    contactIssues: {
      en: "For any issues with the apartment, please contact: <strong>Jan Kowalski</strong> at <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> or phone <a href='tel:+48123456789'>+48 123 456 789</a>",
      pl: "W razie problemów z apartamentem prosimy o kontakt: <strong>Jan Kowalski</strong> – <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> lub telefon <a href='tel:+48123456789'>+48 123 456 789</a>",
      de: "Bei Problemen mit der Wohnung kontaktieren Sie bitte: <strong>Jan Kowalski</strong> unter <a href='mailto:jan@zenprestigewarsaw.pl'>jan@zenprestigewarsaw.pl</a> oder Telefon <a href='tel:+48123456789'>+48 123 456 789</a>"
    },
    contactSuggestions: {
      en: "For any suggestions about the apartment or this site, please contact us at <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>",
      pl: "Masz sugestie dotyczące apartamentu lub tej strony? Napisz na <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>",
      de: "Haben Sie Vorschläge zum Apartment oder dieser Seite? Schreiben Sie an <a href='mailto:myapartment@gmail.com'>myapartment@gmail.com</a>"
    },
    noResults: {
      en: "No instructions found. Try another keyword.",
      pl: "Nie znaleziono instrukcji. Spróbuj innego słowa.",
      de: "Keine Anweisungen gefunden. Versuchen Sie ein anderes Wort."
    }
  };

  // === Load Content ===
  async function loadContent() {
	  try {
		const res = await fetch('content.json?v=' + Date.now()); // ← CHANGED
		if (!res.ok) throw new Error('Not found');
		content = await res.json();
	  } catch (err) {
      console.warn('Offline or error:', err);
      showOfflineNotice(true);
      const cache = await caches.open('apartment-guide-v1');
      const cached = await cache.match('content.json');
      if (cached) content = await cached.json();
      else {
        panelsContainer.innerHTML = `<div style="color:red;padding:2rem;">No cached content. Connect to internet first.</div>`;
        return;
      }
    }
    allPanels = content[currentLang] || content.en || [];
    renderPanels(allPanels);
    updateUI();
  }

  function showOfflineNotice(show) {
    // Optional: add offline banner if needed
  }

  function updateUI() {
    // Title
    pageTitle.textContent = content.titles?.[currentLang] || "Welcome";

    // Search placeholder
    searchInput.placeholder = translations.searchPlaceholder[currentLang];

    // No results
    noResults.textContent = translations.noResults[currentLang];

    // Contact
    contactTitle.textContent = translations.contactTitle[currentLang];
    contactIssues.innerHTML = translations.contactIssues[currentLang];
    contactSuggestions.innerHTML = translations.contactSuggestions[currentLang];
  }

  // === Render Panels ===
  function renderPanels(panelsToShow) {
    panelsContainer.innerHTML = '';
    if (panelsToShow.length === 0) {
      noResults.style.display = 'block';
      return;
    }
    noResults.style.display = 'none';

    panelsToShow.forEach(panel => {
      const div = document.createElement('div');
      div.className = 'panel visible';
      div.innerHTML = `
        <div class="panel-title">${panel.title}</div>
        <div class="panel-content">
          <div class="panel-text">${panel.html}</div>
        </div>
      `;
      panelsContainer.appendChild(div);

      div.querySelector('.panel-title').addEventListener('click', () => {
        div.classList.toggle('active');
      });

      div.querySelectorAll('.thumb').forEach(img => {
        img.addEventListener('click', () => {
          lightboxImg.src = img.src;
          lightbox.classList.add('active');
        });
      });
    });
  }

  // === Search ===
  function filterPanels(q) {
    if (!q.trim()) return renderPanels(allPanels);
    const lower = q.toLowerCase();
    const matches = allPanels.filter(p =>
      p.title.toLowerCase().includes(lower) || p.html.toLowerCase().includes(lower)
    );
    renderPanels(matches);
  }

  // === Language Switch ===
  flags.forEach(f => f.addEventListener('click', () => {
    currentLang = f.dataset.lang;
    flags.forEach(x => x.classList.remove('active'));
    f.classList.add('active');
    allPanels = content[currentLang] || content.en;
    updateUI();
    filterPanels(searchInput.value);
  }));

  searchInput.addEventListener('input', () => filterPanels(searchInput.value));
  lightbox.addEventListener('click', () => lightbox.classList.remove('active'));

  // === Theme ===
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', currentTheme);
    themeToggle.innerHTML = currentTheme === 'light'
      ? '<i class="ti ti-moon"></i>'
      : '<i class="ti ti-sun"></i>';
  }

  themeToggle.addEventListener('click', () => {
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    localStorage.setItem('theme', currentTheme);
    applyTheme();
  });

  // === Init ===
  applyTheme();
  loadContent();
</script>
</body>
</html>
