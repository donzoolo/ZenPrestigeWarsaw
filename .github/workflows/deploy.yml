# .github/workflows/deploy.yml
name: Deploy PWA

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          VERSION="v$(date +'%Y%m%d.%H%M')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION = \"$VERSION\";" > version.js

      - name: Inject version
        run: |
          sed -i "s/const VERSION = \".*\"/const VERSION = \"${{ steps.version.outputs.version }}\"/" index.html
          sed -i "s/const CACHE = '.*'/const CACHE = 'pwa-${{ steps.version.outputs.version }}'/" sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4